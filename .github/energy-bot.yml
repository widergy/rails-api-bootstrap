# Cheatsheet de keys generales
# active: boolean. Indica si está activado o no el handler
# version: integer. Indica la versión del handler
# config: object. Configuración del handler

handlers:
  create_new_release:
    version: 3
    active: true
    config:
      assignees:
        - guidodinatale
      labels:
        - Release
      defer: false
      defer_time: 0
      release_name: 'Release'
      release_branch_name: 'release'
  mergeable:
    version: 3
    active: true
    config:
      allow_merge_to_master: false
  cleanup_release:
    active: true
  is_semantic:
    active: true
  notify_and_clean_released:
    active: true
    notify: true
    clean: true
    transition: true
  level_with_master:
    version: 3
    active: true
    config:
      assignees:
        - guidodinatale
      defer: true
      defer_time: 0.25
  complete_new_pr:
    active: true
    version: 1
  assigner:
    active: true
    version: 1
  ai_review:
    active: true
    version: 2
  check_dependencies:
    active: true
    version: 1
